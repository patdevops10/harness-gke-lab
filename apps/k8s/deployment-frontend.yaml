apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-frontend-app
  labels:
    app: harness-frontend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-frontend-app
  template:
    metadata:
      labels:
        app: harness-frontend-app
    spec:
      containers:
      - name: nginx-server
        # 💡 Harness will replace this image URL (frontend)
        image: us-east1-docker.pkg.dev/gp-project-480716/gp-harness-repository-registry/frontend-app:22 
        ports:
        - containerPort: 80